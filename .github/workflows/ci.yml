# Kamutan CI — runs on every PR and on push to main.
#
# Security notes (06_security.md SEC-44..SEC-50):
# - Workflow-level permissions are read-only; jobs widen only what they need.
# - Never add `pull_request_target` here (SEC-48).
# - Every action is pinned to a full commit SHA with the release tag as a trailing comment
#   (SEC-48); Dependabot (github-actions ecosystem) keeps the pins updated.
# - Security scanners emit their findings as workflow annotations (readable via the checks API
#   without downloading logs).
# - The single status check to mark as "required" in branch protection is `ci-gate`.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Path filters (used by benchmark + docker jobs)
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
      docker: ${{ steps.filter.outputs.docker }}
      python: ${{ steps.filter.outputs.python }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bench:
              - 'workers/**'
              - 'benchmark/**'
            docker:
              - 'infra/docker/**'
              - 'workers/drawing/**'
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            python:
              - 'workers/**'
              - 'benchmark/**'
              - '.github/workflows/ci.yml'
            fuzz:
              - 'workers/drawing/**'
              - 'infra/docker/worker-drawing*'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # TypeScript: lint, typecheck, test, build via turbo
  # ---------------------------------------------------------------------------
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile, SEC-44)
        run: pnpm install --frozen-lockfile
      - name: Hosting security headers (firebase.json, SEC-40)
        # Static invariants; the browser-level CSP check runs nightly in dast.yml.
        run: node infra/scripts/check-hosting-headers.mjs firebase.json
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Test
        # Emulator-backed suites skip here (no FIRESTORE_EMULATOR_HOST); they run in the `db` job.
        run: pnpm turbo run test
      - name: Build
        run: pnpm turbo run build
      - name: Generated contracts are up to date
        # 04_architecture: `turbo run gen` in CI, a non-empty diff fails the build.
        # Activates automatically once a `gen` task is declared in turbo.json.
        run: |
          if jq -e '.tasks.gen' turbo.json >/dev/null; then
            pnpm turbo run gen
            git diff --exit-code || {
              echo "::error::Generated files are stale. Run 'pnpm turbo run gen' and commit."; exit 1; }
          else
            echo "::notice::No 'gen' task in turbo.json yet — skipping generated-files check."
          fi

  # ---------------------------------------------------------------------------
  # Python: ruff, mypy, pytest (uv) — workers/drawing and benchmark
  # ---------------------------------------------------------------------------
  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [workers/drawing, benchmark]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      UV_LOCKED: "1"
      RUFF_VERSION: "0.17.0"
      MYPY_VERSION: "2.4.0"
      BANDIT_VERSION: "1.9.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: System packages (Tesseract heb+eng)
        if: matrix.project == 'workers/drawing'
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng
          tesseract --list-langs
      - name: Install (uv sync --locked)
        # --all-extras: same dependency set as the runtime image (infra/docker/worker-drawing.Dockerfile),
        # so mypy/pytest check against the real google-cloud clients instead of missing imports.
        run: uv sync --locked --all-groups --all-extras
      - name: Ruff (lint)
        run: uvx ruff@${{ env.RUFF_VERSION }} check .
      - name: Ruff (format check)
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .
      - name: Mypy
        run: uv run --with "mypy==${{ env.MYPY_VERSION }}" mypy src
      - name: Bandit (SAST, SEC-50)
        run: uvx bandit@${{ env.BANDIT_VERSION }} -q -r src -ll
      - name: Pytest
        # KAMUTAN_DATA_DIR is intentionally unset: tests that need real drawings must skip.
        # Exit code 5 = "no tests collected" (allowed during Sprint 0 scaffolding).
        run: |
          set +e
          uv run pytest -q
          rc=$?
          if [ "$rc" -eq 5 ]; then echo "::warning::No tests collected in ${{ matrix.project }}"; exit 0; fi
          exit $rc

  # ---------------------------------------------------------------------------
  # Parser fuzzing, PR budget (SEC-16/17, Sprint-1 gate "fuzzing ראשוני ל-PDF ול-DXF ב-CI").
  # Hypothesis structure-aware fuzzers + the fixed hostile corpus against the parser sandbox
  # (workers/drawing/tests/fuzz). ~60 s of generative time + ~45 s corpus. Long runs: nightly.yml.
  # Hypothesis is pinned here (not a project dependency); inputs are synthetic only.
  # ---------------------------------------------------------------------------
  fuzz:
    name: Fuzz (parser sandbox, PR budget)
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/drawing
    env:
      UV_LOCKED: "1"
      HYPOTHESIS_VERSION: "6.168.5"
      KAMUTAN_FUZZ: "1"
      KAMUTAN_FUZZ_BUDGET_S: "60"
      KAMUTAN_FUZZ_TARGET: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: workers/drawing/uv.lock
      - name: Install (uv sync --locked)
        run: uv sync --locked --all-groups
      - name: Fuzz (corpus + generative, ${{ env.KAMUTAN_FUZZ_BUDGET_S }} s budget)
        # A failure prints Hypothesis' minimal recipe and an @reproduce_failure blob; add the input as a
        # named case in tests/fuzz/test_corpus.py when fixing it.
        run: |
          uv run --locked --with "hypothesis==${HYPOTHESIS_VERSION}" \
            pytest -m fuzz tests/fuzz -q -s -p no:cacheprovider --junitxml="$RUNNER_TEMP/fuzz.xml"

  # ---------------------------------------------------------------------------
  # Infra scripts: shellcheck + dry-runs of the backup / restore-drill tooling (SEC-36..38),
  # ZAP gate unit check. No cloud access: --dry-run only prints the gcloud commands.
  # ---------------------------------------------------------------------------
  infra-scripts:
    name: Infra scripts (shellcheck, dry-runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x infra/scripts/*.sh infra/scripts/lib/*.sh
      - name: Backup setup dry-run
        run: bash infra/scripts/setup-backups.sh --project kamutan-fba67 --backup-project kamutan-backup-eu --dry-run
      - name: Restore drill dry-runs (export + backup modes)
        run: |
          set -euo pipefail
          bash infra/scripts/restore-drill.sh --project kamutan-fba67 --scratch-project kamutan-drill \
            --backup-bucket kamutan-fba67-firestore-backup-eu --storage-backup-bucket kamutan-fba67-storage-backup-eu \
            --dry-run --out "$RUNNER_TEMP/drill-export"
          bash infra/scripts/restore-drill.sh --mode backup --dry-run --out "$RUNNER_TEMP/drill-backup"
          jq -e '.dryRun and .passed' "$RUNNER_TEMP/drill-export/results.json" "$RUNNER_TEMP/drill-backup/results.json"
      - name: API jobs / purge IAM setup dry-run
        run: |
          bash infra/scripts/setup-api-jobs.sh --project kamutan-fba67 --dry-run \
            --purge-image "europe-west1-docker.pkg.dev/kamutan-fba67/kamutan/api-jobs@sha256:$(printf '0%.0s' $(seq 64))"
      - name: Monitoring setup dry-run
        run: bash infra/monitoring/setup-alerts.sh --project kamutan-fba67 --notification-email security@example.com --dry-run
      - name: ZAP gate self-test
        run: python3 infra/scripts/zap_gate_selftest.py

  # ---------------------------------------------------------------------------
  # DB: Firestore/Storage security rules + API integration on the Firebase Emulator Suite
  # (ADR-0008, SEC-06, SEC-09). The emulators cannot be downloaded in the dev sandbox, so these
  # suites skip locally and are enforced here. The wrapper fails if the emulator env is missing,
  # so the suites can never "pass" by silently skipping.
  # ---------------------------------------------------------------------------
  db:
    name: DB (Firebase rules + emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIREBASE_TOOLS_VERSION: "15.33.0"
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Build workspace libraries used by the suites
        run: pnpm turbo run build --filter=@kamutan/contracts
      - name: Security rules suite (Firestore + Storage emulators)
        # Includes the Sprint-1 ingest suites (ingest.rules.test.ts: sheets/versions/jobs; storage.rules.test.ts:
        # quarantine, sources, sheet-version artifacts). JSON report is checked below so no suite can pass by skipping.
        run: |
          # shellcheck disable=SC2016  # single quotes on purpose: expanded inside emulators:exec
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --only firestore,storage --project demo-kamutan --config firebase/firebase.rules-test.json \
            'test -n "$FIRESTORE_EMULATOR_HOST" && test -n "$FIREBASE_STORAGE_EMULATOR_HOST" && pnpm --filter @kamutan/firebase-tests exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/rules-tests.json"'
      - name: Failed rules tests as annotations
        # GitHub keeps at most 10 annotations per step: failures are grouped by error message
        # (one annotation per distinct cause, with the count and the first failing test names).
        if: failure()
        run: |
          r="$RUNNER_TEMP/rules-tests.json"
          [ -s "$r" ] || { echo "::error::no vitest JSON report (suite crashed before reporting)"; exit 0; }
          jq -r '
            [ .testResults[] | (.name | sub(".*/kamutan/"; "")) as $f
              | ( (select(.status == "failed" and ((.assertionResults | map(select(.status == "failed")) | length) == 0))
                   | {f: $f, t: "(suite)", m: (.message // "")}),
                  (.assertionResults[] | select(.status == "failed")
                   | {f: $f, t: .fullName, m: ((.failureMessages // []) | join(" "))}) ) ]
            | map(.m |= (gsub("\n"; " ") | .[0:300]))
            | group_by(.m)[]
            | "::error file=\(.[0].f)::\(length) failed — \(.[0].m) — e.g. \([.[0:3][].t] | join(" | "))"' "$r" | head -9
      - name: Rules suites actually ran (no skipped emulator tests)
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/rules-tests.json"
          for f in firestore.rules.test.ts storage.rules.test.ts ingest.rules.test.ts understanding.rules.test.ts; do
            n=$(jq --arg f "$f" '[.testResults[] | select(.name | endswith($f)) | .assertionResults[]] | length' "$r")
            skipped=$(jq --arg f "$f" '[.testResults[] | select(.name | endswith($f)) | .assertionResults[] | select(.status != "passed")] | length' "$r")
            echo "$f: $n tests, $skipped not passed"
            if [ "$n" -eq 0 ] || [ "$skipped" -ne 0 ]; then echo "::error::$f did not fully run under the emulator"; exit 1; fi
          done
      - name: API integration suite (Firestore + Storage + Pub/Sub emulators)
        run: |
          # shellcheck disable=SC2016  # single quotes on purpose: expanded inside emulators:exec
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --only firestore,storage,pubsub --project demo-kamutan \
            'test -n "$FIRESTORE_EMULATOR_HOST" && test -n "$FIREBASE_STORAGE_EMULATOR_HOST" && test -n "$PUBSUB_EMULATOR_HOST" && pnpm --filter @kamutan/api exec vitest run test/integration'

  # ---------------------------------------------------------------------------
  # Security: secrets, SCA (SEC-24, SEC-45, SEC-50)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Security / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (verified checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${tgz}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tgz" checksums.txt gitleaks
      - name: gitleaks (full history)
        run: |
          set +e
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          rc=$?
          # Findings as annotations (secrets are redacted; only rule/file/line/commit are printed).
          [ -s "$RUNNER_TEMP/gitleaks.json" ] && jq -r '.[] |
            "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) in commit \(.Commit[0:12])"' \
            "$RUNNER_TEMP/gitleaks.json"
          exit $rc

  semgrep:
    name: Security / Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest # TODO(SEC-46): pin by digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep CE (OWASP Top 10 + TS + Python + custom Kamutan rules)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/python \
            --config p/github-actions \
            --config .semgrep.yml \
            --exclude benchmark/.venv --exclude workers/drawing/.venv \
            --metrics off --error --severity ERROR --severity WARNING \
            --json-output=/tmp/semgrep.json
      - name: Semgrep findings as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/semgrep.json"))
          for r in d.get("results", []):
              lvl = "error" if r["extra"].get("severity") == "ERROR" else "warning"
              msg = " ".join(r["extra"].get("message", "").split())[:300]
              print(f"::{lvl} file={r['path']},line={r['start']['line']}::{r['check_id']}: {msg}")
          for e in d.get("errors", []):
              print(f"::warning::semgrep error: {' '.join(str(e.get('message', e)).split())[:300]}")
          PY

  osv:
    name: Security / osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OSV_VERSION: "2.2.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (verified checksum)
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          bin="osv-scanner_linux_amd64"
          curl -sSfLO "$base/$bin"
          curl -sSfL "$base/osv-scanner_SHA256SUMS" -o sums.txt
          grep " ${bin}\$" sums.txt | sha256sum -c -
          sudo install -m 0755 "$bin" /usr/local/bin/osv-scanner
          rm -f "$bin" sums.txt
      - name: Scan lockfiles
        run: |
          args=()
          for f in pnpm-lock.yaml workers/drawing/uv.lock benchmark/uv.lock; do
            [ -f "$f" ] && args+=(-L "$f")
          done
          set +e
          osv-scanner scan source "${args[@]}"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Re-emit findings as annotations (readable via the checks API).
            osv-scanner scan source --format gh-annotations "${args[@]}" || true
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  # Container images: build (no push) + Trivy (SEC-45). Only when relevant paths change.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build + Trivy (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The API ships as Cloud Functions (ADR-0008); its batch jobs (offboarding purge) ship as a Cloud Run job image.
        include:
          - image: worker-drawing
            dockerfile: infra/docker/worker-drawing.Dockerfile
            requires: workers/drawing/pyproject.toml
          - image: api-jobs
            dockerfile: infra/docker/api-jobs.Dockerfile
            requires: apps/api/src/scripts/offboard-purge.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the service exists yet
        id: exists
        run: |
          if [ -f "${{ matrix.requires }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.requires }} missing — skipping ${{ matrix.image }} image"; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.ok == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.ok == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: kamutan/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy (block on fixable CRITICAL/HIGH)
        if: steps.exists.outputs.ok == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kamutan/${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy findings as annotations (logs are not always reachable)
        if: failure() && steps.exists.outputs.ok == 'true'
        env:
          IMAGE: kamutan/${{ matrix.image }}:ci
        run: |
          trivy image --quiet --severity CRITICAL,HIGH --ignore-unfixed --format json "$IMAGE" \
            | jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "::error title=Trivy \(.Severity)::\($t): \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\(.VulnerabilityID))"' \
            | head -50

  # ---------------------------------------------------------------------------
  # Benchmark gate (placeholder). Runs only when workers/** or benchmark/** change.
  # Skips gracefully when the KAMUTAN_DATA_* secrets are absent (forks, Sprint 0).
  # Customer drawings are NEVER stored in the repo or uploaded as artifacts (SEC-54).
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmark (kbench)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check benchmark data secrets
        id: data
        env:
          DATA_URL: ${{ secrets.KAMUTAN_DATA_URL }}
          DATA_KEY: ${{ secrets.KAMUTAN_DATA_KEY }}
        run: |
          if [ -n "$DATA_URL" ] && [ -n "$DATA_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KAMUTAN_DATA_URL/KAMUTAN_DATA_KEY not configured — benchmark skipped."
            echo "### Benchmark skipped: data secrets not configured" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.data.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.data.outputs.available == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Fetch + decrypt benchmark dataset (placeholder)
        if: steps.data.outputs.available == 'true'
        env:
          DATA_URL: ${{ secrets.KAMUTAN_DATA_URL }}
          DATA_KEY: ${{ secrets.KAMUTAN_DATA_KEY }}
        run: |
          set -euo pipefail
          umask 077
          dest="$RUNNER_TEMP/kamutan-data"
          mkdir -p "$dest"
          # TODO(sprint-1): download an age-encrypted tarball from the private bucket
          # (short-lived signed URL in KAMUTAN_DATA_URL) and decrypt with KAMUTAN_DATA_KEY:
          #   curl -sSfL "$DATA_URL" -o "$RUNNER_TEMP/data.tar.age"
          #   age -d -i <(printf '%s' "$DATA_KEY") "$RUNNER_TEMP/data.tar.age" | tar -x -C "$dest"
          echo "KAMUTAN_DATA_DIR=$dest" >> "$GITHUB_ENV"
      - name: Run kbench (placeholder)
        if: steps.data.outputs.available == 'true'
        working-directory: benchmark
        run: |
          uv sync --locked
          # TODO(sprint-1): uv run kbench run --data "$KAMUTAN_DATA_DIR" --baseline main --out "$RUNNER_TEMP/kbench-report"
          # and fail on regressions per 07_test_plan thresholds.
          uv run python -c "import kbench; print('kbench import ok')"
      - name: Wipe dataset
        if: always() && steps.data.outputs.available == 'true'
        run: rm -rf "$RUNNER_TEMP/kamutan-data" "$RUNNER_TEMP/data.tar.age"

  # ---------------------------------------------------------------------------
  # Single required check for branch protection.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, node, python, fuzz, infra-scripts, db, secrets-scan, semgrep, osv, docker, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded (skipped is OK for path-filtered jobs)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result=="failure" or .value.result=="cancelled")] | length')
          if [ "$bad" != "0" ]; then echo "::error::$bad job(s) failed or were cancelled"; exit 1; fi
