# Kamutan deploy. Platform: Firebase + Cloud Run (ADR-0008).
#
# Flow (04_architecture "CI/CD", as amended by ADR-0008):
#   CI green on main (workflow_run) -> staging                  [environment: staging,    manual approval]
#   tag v*                          -> staging -> production    [environment: production, manual approval]
#   manual run                      -> chosen environment
#
# The per-environment work lives in _deploy-env.yml (one implementation for both environments):
#   - `gcloud run services update kamutan-worker` (image infra/docker/worker-drawing.Dockerfile, by digest)
#   - `firebase deploy --only firestore:rules,firestore:indexes,storage,functions:api,hosting`
#
# Rules (SEC-48, SEC-49, SEC-53):
# - No secrets inline and no service-account key files. Auth to Google Cloud uses Workload Identity
#   Federation (OIDC, `id-token: write` only on the deploy jobs) configured through *Environment*
#   variables, which are only released after a required reviewer (human owner) approves the job.
# - Every step that needs cloud access skips with a notice while that configuration is absent.
# - Actions are pinned to full commit SHAs (tag in a trailing comment).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  # Never run two deploys to the same environment at once; do not cancel an in-flight deploy.
  group: deploy-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # workflow_run fires for every CI completion on main; only deploy green, push-triggered runs.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      # Safe: workflow_run is restricted above to *push* events on main that passed CI, so
      # head_sha is a commit already on main (never untrusted fork code). No checkout, no secrets here.
      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::Unexpected commit id."; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  staging:
    name: Staging
    needs: meta
    if: >-
      github.event_name == 'workflow_run' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
      sha: ${{ needs.meta.outputs.sha }}
    permissions:
      contents: read
      id-token: write

  guard-production:
    name: Guard — production only from main
    needs: meta
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit must be on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::Manual production deploys must run from main."; exit 1; fi
          # A v* tag pushed from a side branch must not reach production.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Commit $SHA is not on main — refusing to deploy it to production."; exit 1; fi

  production:
    name: Production
    needs: [meta, staging, guard-production]
    if: >-
      always() && needs.meta.result == 'success' && needs.guard-production.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: production
      sha: ${{ needs.meta.outputs.sha }}
    permissions:
      contents: read
      id-token: write
