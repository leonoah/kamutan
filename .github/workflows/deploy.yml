# Kamutan deploy — STUB (Sprint 0).
#
# Flow (04_architecture "CI/CD"):
#   CI green on main (workflow_run) -> staging   [environment: staging,    manual approval]
#   tag v*        -> staging -> production    [environment: production, manual approval]
#   manual run    -> chosen environment
#
# Rules (SEC-48, SEC-49, SEC-53):
# - No secrets inline. All secrets live in GitHub *Environment* secrets (staging / production),
#   which are only released after a required reviewer (human owner) approves the job.
# - Production migrations run only from this workflow, never from a developer/agent machine.
# - Prefer OIDC over long-lived keys wherever the target supports it (id-token: write is granted
#   only to deploy jobs).
# - TODO(sprint-1): pin all actions to full commit SHAs.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  # Never run two deploys to the same environment at once; do not cancel an in-flight deploy.
  group: deploy-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}
  cancel-in-progress: false

jobs:
  build-images:
    name: Build + push images (GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # workflow_run fires for every CI completion on main; only deploy green, push-triggered runs.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7 # TODO: pin SHA
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push (placeholder)
        run: |
          echo "TODO(sprint-1): docker/login-action (GITHUB_TOKEN) + docker/build-push-action for"
          echo "  ghcr.io/leonoah/kamutan-api:${{ steps.meta.outputs.tag }}            (infra/docker/api.Dockerfile)"
          echo "  ghcr.io/leonoah/kamutan-worker-drawing:${{ steps.meta.outputs.tag }} (infra/docker/worker-drawing.Dockerfile)"
          echo "  + SBOM (syft, SEC-46) + Trivy gate (SEC-45); deploy by digest, never :latest."

  staging:
    name: Deploy → staging
    needs: build-images
    if: >-
      github.event_name == 'workflow_run' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7 # TODO: pin SHA
        with:
          persist-credentials: false
          ref: ${{ needs.build-images.outputs.sha }}
      - name: Supabase migrations (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase staging not configured yet — skipping migrations."; exit 0; fi
          echo "TODO(sprint-1): npx supabase@<pinned> link --project-ref \"$SUPABASE_PROJECT_REF\" && npx supabase db push"
      - name: Railway deploy (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "::notice::RAILWAY_TOKEN not set — skipping."; exit 0; fi
          echo "TODO(sprint-1): railway up / redeploy api, worker-drawing-heavy, worker-drawing-light, export-worker"
          echo "  with image ghcr.io/leonoah/kamutan-*:${{ needs.build-images.outputs.tag }}"
      - name: Vercel (apps/web) — staging
        run: |
          echo "Vercel deploys apps/web via its Git integration (preview per PR, staging alias on main)."

  production:
    name: Deploy → production
    needs: [build-images, staging]
    if: >-
      always() && needs.build-images.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7 # TODO: pin SHA
        with:
          persist-credentials: false
      - name: Guard — production deploys only from a tag on main
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Manual production deploys must run from main."; exit 1; fi
      - name: Supabase migrations (production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase production not configured yet — skipping migrations."; exit 0; fi
          echo "TODO(sprint-5): supabase db push against production (after backup snapshot)."
      - name: Railway promote (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "::notice::RAILWAY_TOKEN not set — skipping."; exit 0; fi
          echo "TODO(sprint-5): promote image digest ${{ needs.build-images.outputs.tag }} to the production environment"
      - name: Vercel (apps/web) — production
        run: |
          echo "TODO(sprint-5): promote the staging Vercel deployment to production (vercel promote)."
