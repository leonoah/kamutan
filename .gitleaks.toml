# gitleaks configuration (SEC-24). Runs in pre-commit and in CI (.github/workflows/ci.yml).
# Extends the upstream default ruleset; only narrowly-scoped allowlists are added here.
# Any change to this file requires CODEOWNERS (human) approval.

title = "Kamutan gitleaks config"

[extend]
useDefault = true

# Extra rule: Supabase service_role / secret keys assigned in code or config.
[[rules]]
id = "kamutan-supabase-service-role"
description = "Supabase service_role / secret key assignment"
regex = '''(?i)(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|service_role_key)\s*[:=]\s*["']?(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|sb_secret_[A-Za-z0-9_-]{20,})'''
keywords = ["service_role", "supabase_secret", "sb_secret_"]

# Extra rule: Postgres URLs with an inline password (worker role, SEC-24 / ADR-0003).
[[rules]]
id = "kamutan-postgres-url-with-password"
description = "Postgres connection string with inline password"
regex = '''postgres(?:ql)?://[^:\s/]+:([^@\s]{6,})@[^\s"']+'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]
  [[rules.allowlists]]
  description = "Local Supabase CLI default password and obvious placeholders"
  regexTarget = "match"
  regexes = [
    '''postgres(?:ql)?://postgres:postgres@(localhost|127\.0\.0\.1|host\.docker\.internal|db|supabase_db_[a-z0-9_-]+)(:\d+)?/''',
    '''://[^:]+:(CHANGE_ME|changeme|password|<[^>]+>|\$\{?[A-Z_]+\}?)@''',
  ]

# Narrow, rule-targeted allowlists (gitleaks >= 8.25 `[[allowlists]]` with targetRules + AND).
# Each one must name the rule, the exact path and the exact shape of the value it tolerates.

[[allowlists]]
# Firebase *web* API key (ADR-0008). It identifies the Firebase project to browsers and ships in
# every client bundle by design; it grants no access by itself — access is enforced by Firebase
# Auth + Firestore/Storage Security Rules, and the key is API-restricted in Google Cloud console.
# Only this one variable in this one committed file is tolerated; any other GCP key still fails.
description = "Public Firebase web API key in apps/web/.env.firebase"
targetRules = ["gcp-api-key", "generic-api-key"]
condition = "AND"
paths = ['''^apps/web/\.env\.firebase$''']
regexTarget = "line"
regexes = ['''(^|\n)VITE_FIREBASE_API_KEY=AIza[\w-]{35}(\r?\n|$)''']

[[allowlists]]
# Deterministic, obviously-fake HMAC secrets used only by unit tests (e.g. commit 46ae3fe,
# apps/api/test/support/helpers.ts: `test-jwt-secret-...`). Real secrets never start with `test-`.
description = "Fake secrets in test support fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)test/support/[^/]+\.ts$''']
regexTarget = "secret"
regexes = ['''^test-[a-z0-9-]+$''']

[[allowlists]]
description = "Global allowlist: example env files and lockfiles only"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.[a-z]+\.example$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
]
# Code references, not secrets: dotted identifier paths such as `opts.hs256Secret`,
# `process.env.FOO`, `cfg.UPLOAD_TOKEN_SECRET` (matched against the captured secret only).
regexTarget = "secret"
regexes = [
  '''^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)+$''',
]
