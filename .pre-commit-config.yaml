# pre-commit hooks (SEC-24, SEC-44, SEC-54). Install once:  pipx install pre-commit && pre-commit install
# CI re-runs the same checks (gitleaks, ruff, Semgrep), so hooks are a fast local safety net, not the gate.
# Pin `rev` values; `pre-commit autoupdate` + PR review to bump them.
default_install_hook_types: [pre-commit]
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        files: ^(workers|benchmark)/.*\.pyi?$
      - id: ruff-format
        args: ["--check"]
        files: ^(workers|benchmark)/.*\.pyi?$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
        exclude: (^|/)tsconfig[^/]*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      # SEC-54: customer drawings / datasets never enter git (mirrors .gitignore).
      - id: forbid-drawings
        name: forbid customer drawings (PDF/DWG/DXF/XLS)
        language: fail
        entry: "Drawings/BOQ files must not be committed (SEC-54). Use KAMUTAN_DATA_DIR / the private bucket."
        files: (?i)\.(pdf|dwg|dxf|xls|xlsx)$
        exclude: ^(apps|packages|workers|benchmark)/.*/fixtures/synthetic/

      - id: forbid-env-files
        name: forbid .env files (only .env.example is allowed)
        language: fail
        entry: "Do not commit .env files (SEC-24)."
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env(\.[a-z]+)?\.example$

      - id: prettier-check
        name: prettier --check (TS/JSON/YAML/MD)
        language: system
        entry: pnpm exec prettier --check --ignore-unknown
        types_or: [ts, tsx, javascript, json, yaml, markdown, css]
        exclude: ^(pnpm-lock\.yaml|docs/spec/)
        # Requires `prettier` in root devDependencies (owner of package.json: orchestrator).
