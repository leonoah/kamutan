[project]
name = "kbench"
version = "0.1.0"
description = "kbench: Kamutan accuracy benchmark harness"
readme = "NOTES.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "xlrd>=2.0.2",
]

[project.scripts]
kbench = "kbench:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
    "scipy-stubs>=1.18.1.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-openpyxl>=3.1.5.20260827",
    "types-shapely>=2.1.0.20260728",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclass: safe to use as a default argument.
extend-immutable-calls = ["kbench.matching.MatchParams"]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
# No type information published for these (no py.typed, no maintained stubs package);
# scipy, jsonschema and shapely are covered by stub packages in the dev group.
module = ["pypdfium2", "pypdfium2.*", "xlrd", "xlrd.*"]
ignore_missing_imports = true
