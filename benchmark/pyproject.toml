[project]
name = "kbench"
version = "0.1.0"
description = "kbench: Kamutan accuracy benchmark harness"
readme = "NOTES.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "xlrd>=2.0.2",
]

[project.scripts]
kbench = "kbench:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
