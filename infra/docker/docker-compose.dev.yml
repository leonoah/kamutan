# Local development: the drawing worker container against the Firebase Emulator Suite.
#
# The API runs as a Cloud Function and the web app via Vite; neither needs Docker locally:
#     firebase emulators:start --only auth,firestore,storage,pubsub --project demo-kamutan
#     pnpm --filter @kamutan/api dev
#     pnpm --filter @kamutan/web dev
# Then (from repo root) start the worker container:
#     docker compose -f infra/docker/docker-compose.dev.yml up --build
# Push a job manually to http://127.0.0.1:8081/pubsub/ingest (Pub/Sub push envelope).
#
# Sample drawings are mounted read-only from KAMUTAN_DATA_DIR (outside the repo, SEC-54).
# No credentials are mounted: emulators need none, and real GCP access is never used locally.

name: kamutan-dev

services:
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker-drawing.Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      GOOGLE_CLOUD_PROJECT: demo-kamutan
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080
      STORAGE_EMULATOR_HOST: http://host.docker.internal:9199
      KAMUTAN_BUCKET: demo-kamutan.appspot.com
      KAMUTAN_DATA_DIR: /data/kamutan
      KAMUTAN_LLM_ENABLED: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: bind
        source: ${KAMUTAN_DATA_DIR:-/tmp/kamutan-data-empty}
        target: /data/kamutan
        read_only: true
        bind:
          create_host_path: true
    tmpfs:
      - /work:size=2g,mode=1777
    # SEC-17 resource limits, mirroring the Cloud Run service (2 vCPU / 4 GiB).
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
