[project]
name = "kamutan-drawing"
version = "0.1.0"
description = "Kamutan drawing ingest & OCR workers"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ezdxf>=1.4.4",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]
