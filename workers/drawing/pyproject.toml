[project]
name = "kamutan-drawing"
version = "0.2.0"
description = "Kamutan drawing ingest & OCR workers"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.4",
    "fastapi>=0.143.0",
    "msgpack>=1.2.3",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.54.0",
]
gcp = [
    "google-auth>=2.61.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"spikes/**" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# google-cloud-storage ships no py.typed marker (firestore / api_core / auth are typed and checked;
# CI installs --all-extras so they are type-checked against the real packages).
module = ["google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# msgpack ships no py.typed marker
module = ["msgpack", "msgpack.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypdfium2 ships no type information (no py.typed / stubs); scipy is covered by scipy-stubs.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
